name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'library/build.gradle.kts'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Check if version changed
      id: version_check
      run: |
        # 現在のバージョンを取得
        CURRENT_VERSION=$(grep "^version = " library/build.gradle.kts | head -1 | sed 's/version = "\(.*\)"/\1/')

        # 前のコミットのバージョンを取得
        git show HEAD~1:library/build.gradle.kts > /tmp/prev_build.gradle.kts 2>/dev/null || echo 'version = "0.0.0"' > /tmp/prev_build.gradle.kts
        PREV_VERSION=$(grep "^version = " /tmp/prev_build.gradle.kts | head -1 | sed 's/version = "\(.*\)"/\1/')

        echo "Previous version: $PREV_VERSION"
        echo "Current version: $CURRENT_VERSION"

        if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
          echo "Version changed!"
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "old_version=$PREV_VERSION" >> $GITHUB_OUTPUT
        else
          echo "Version unchanged"
          echo "version_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Check if tag exists
      id: tag_check
      if: steps.version_check.outputs.version_changed == 'true'
      run: |
        TAG_NAME="v${{ steps.version_check.outputs.new_version }}"
        if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
          echo "Tag $TAG_NAME already exists"
          echo "tag_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Tag $TAG_NAME does not exist"
          echo "tag_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      if: steps.version_check.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
      run: |
        TAG_NAME="v${{ steps.version_check.outputs.new_version }}"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "$TAG_NAME" -m "Release version ${{ steps.version_check.outputs.new_version }}"
        git push origin "$TAG_NAME"
        echo "Created and pushed tag: $TAG_NAME"

    - name: Create GitHub Release
      if: steps.version_check.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version_check.outputs.new_version }}
        name: Release v${{ steps.version_check.outputs.new_version }}
        body: |
          ## Release v${{ steps.version_check.outputs.new_version }}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.version_check.outputs.old_version }}...v${{ steps.version_check.outputs.new_version }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
