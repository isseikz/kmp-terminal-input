name: Version Bump and Tag

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get current version from build.gradle.kts
      id: get_version
      run: |
        VERSION=$(grep "^version = " library/build.gradle.kts | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "Current version: $VERSION"
        echo "current_version=$VERSION" >> $GITHUB_OUTPUT

    - name: Calculate new version
      id: calc_version
      run: |
        CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"
        VERSION_TYPE="${{ github.event.inputs.version_type }}"

        IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}

        case $VERSION_TYPE in
          "major") NEW_MAJOR=$((MAJOR + 1)); NEW_MINOR=0; NEW_PATCH=0 ;;
          "minor") NEW_MAJOR=$MAJOR; NEW_MINOR=$((MINOR + 1)); NEW_PATCH=0 ;;
          "patch") NEW_MAJOR=$MAJOR; NEW_MINOR=$MINOR; NEW_PATCH=$((PATCH + 1)) ;;
        esac

        NEW_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
        echo "New version: $NEW_VERSION"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Update build.gradle.kts
      run: |
        sed -i "s/^version = \"${{ steps.get_version.outputs.current_version }}\"/version = \"${{ steps.calc_version.outputs.new_version }}\"/" library/build.gradle.kts
        
        # 確認用
        echo "Updated version line:"
        grep "^version = " library/build.gradle.kts

    - name: Verify build
      run: ./gradlew :library:build

    - name: Create Pull Request
      id: create_pr
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        commit-message: "chore: bump version to ${{ steps.calc_version.outputs.new_version }}"
        committer: GitHub Action <action@github.com>
        author: GitHub Action <action@github.com>
        branch: "release/v${{ steps.calc_version.outputs.new_version }}"
        delete-branch: true
        base: main
        title: "chore: bump version to ${{ steps.calc_version.outputs.new_version }}"
        body: |
          ## Version Bump
          - **Current version**: ${{ steps.get_version.outputs.current_version }}
          - **New version**: ${{ steps.calc_version.outputs.new_version }}
          - **Bump type**: ${{ github.event.inputs.version_type }}
          
          ## After Merge
          After this PR is merged, create a tag manually or via UI.
        labels: |
          release
          automated

    - name: Output PR URL
      run: |
        echo "Pull Request created: ${{ steps.create_pr.outputs.pull-request-url }}"
