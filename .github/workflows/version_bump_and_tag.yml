name: Version Bump and Tag

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version-bump:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get current version from build.gradle.kts
      id: get_version
      run: |
        # library/build.gradle.kts から現在のバージョンを取得
        VERSION=$(grep "^version = " library/build.gradle.kts | head -1 | sed 's/version = "\(.*\)"/\1/')

        echo "Current version: $VERSION"
        echo "current_version=$VERSION" >> $GITHUB_OUTPUT

    - name: Calculate new version
      id: calc_version
      run: |
        CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"
        VERSION_TYPE="${{ github.event.inputs.version_type }}"

        # バージョン文字列を分割 (例: 1.2.3 -> 1 2 3)
        IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}

        # バージョンタイプに応じて新しいバージョンを計算
        case $VERSION_TYPE in
          "major")
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
            ;;
          "minor")
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
            ;;
          "patch")
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$MINOR
            NEW_PATCH=$((PATCH + 1))
            ;;
        esac

        NEW_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"

        echo "New version: $NEW_VERSION"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Update build.gradle.kts
      run: |
        # version を更新
        sed -i "s/^version = \"${{ steps.get_version.outputs.current_version }}\"/version = \"${{ steps.calc_version.outputs.new_version }}\"/" library/build.gradle.kts

        echo "Updated library/build.gradle.kts:"
        grep "^version = " library/build.gradle.kts

    - name: Verify build
      run: ./gradlew :library:build

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Create branch and commit
      id: create_branch
      run: |
        BRANCH_NAME="release/v${{ steps.calc_version.outputs.new_version }}"
        git checkout -b "$BRANCH_NAME"
        git add library/build.gradle.kts
        git commit -m "chore: bump version to ${{ steps.calc_version.outputs.new_version }}"
        git push origin "$BRANCH_NAME"
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

    - name: Create Pull Request
      id: create_pr
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ steps.create_branch.outputs.branch_name }}
        base: main
        title: "chore: bump version to ${{ steps.calc_version.outputs.new_version }}"
        body: |
          ## Version Bump

          - **Current version**: ${{ steps.get_version.outputs.current_version }}
          - **New version**: ${{ steps.calc_version.outputs.new_version }}
          - **Bump type**: ${{ github.event.inputs.version_type }}

          ## After Merge

          After this PR is merged, create a tag and release:

          ```bash
          git tag -a "v${{ steps.calc_version.outputs.new_version }}" -m "Release version ${{ steps.calc_version.outputs.new_version }}"
          git push origin "v${{ steps.calc_version.outputs.new_version }}"
          ```

          Or use the GitHub UI to create a release with tag `v${{ steps.calc_version.outputs.new_version }}`.
        labels: |
          release
          automated

    - name: Output PR URL
      run: |
        echo "Pull Request created: ${{ steps.create_pr.outputs.pull-request-url }}"
